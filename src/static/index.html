<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оценка стоимости автомобиля</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>Оценка автомобиля</h1>
    <p class="subtitle">ML-модель на базе Random Forest</p>

    <form id="prediction-form">
      <div class="form-grid">
        <div class="input-group">
          <label for="year">Год выпуска</label>
          <input type="number" id="year" name="year" min="1900" step="any" required placeholder="Например: 2018">
        </div>

        <div class="input-group">
          <label for="mileage">Пробег (км)</label>
          <input type="number" id="mileage" name="mileage" min="0" step="any" required placeholder="Например: 75000">
        </div>

        <div class="input-group">
          <label for="power">Мощность (л.с.)</label>
          <input type="number" id="power" name="power" min="0" step="any" required placeholder="Например: 150">
        </div>

        <div class="input-group">
          <label for="price">Цена (Опционально)</label>
          <input type="number" id="price" name="price" min="0" step="any" placeholder="Например: 4256789">
        </div>

        <div class="input-group">
          <label for="brand">Марка</label>
          <input type="text" id="brand" name="brand" list="brand-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="brand-list"></datalist>
        </div>

        <div class="input-group">
          <label for="name">Модель</label>
          <input type="text" id="name" name="name" list="name-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="name-list"></datalist>
        </div>

        <div class="input-group">
          <label for="bodyType">Тип кузова</label>
          <input type="text" id="bodyType" name="bodyType" data-dict="bodyType" list="bodyType-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="bodyType-list"></datalist>
        </div>

        <div class="input-group">
          <label for="color">Цвет</label>
          <input type="text" id="color" name="color" list="color-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="color-list"></datalist>
        </div>

        <div class="input-group">
          <label for="fuelType">Тип двигателя</label>
          <input type="text" id="fuelType" name="fuelType" data-dict="fuelType" list="fuelType-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="fuelType-list"></datalist>
        </div>

        <div class="input-group">
          <label for="transmission">Коробка передач</label>
          <input type="text" id="transmission" name="transmission" list="transmission-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="transmission-list"></datalist>
        </div>

        <div class="input-group">
          <label for="vehicleConfiguration">Конфигурация</label>
          <input type="text" id="vehicleConfiguration" name="vehicleConfiguration" data-dict="vehicleConfiguration" list="vehicleConfiguration-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="vehicleConfiguration-list"></datalist>
        </div>

        <div class="input-group">
          <label for="engineName">Имя двигателя</label>
          <input type="text" id="engineName" name="engineName" data-dict="engineName" list="engineName-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="engineName-list"></datalist>
        </div>

        <div class="input-group">
          <label for="engineDisplacement">Объем двигателя</label>
          <input type="text" id="engineDisplacement" name="engineDisplacement" data-dict="engineDisplacement" list="engineDisplacement-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="engineDisplacement-list"></datalist>
        </div>

        <div class="input-group">
          <label for="location">Город</label>
          <input type="text" id="location" name="location" list="location-list" required placeholder="Начните вводить..." autocomplete="off">
          <datalist id="location-list"></datalist>
        </div>
      </div>

      <button type="submit" id="submit-btn">Оценить</button>
    </form>

    <div id="result-card" class="result-card hidden">
      <h3>Результат оценки</h3>
      <div class="price-display" id="predicted-price">- ₽</div>
      <div class="verdict-display" id="verdict-text">-</div>
    </div>
  </main>
  <script src="app.js"></script>
</body>

</html>
